name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        shell: pwsh
        run: .\setup.cmd
      - name: Verify
        shell: pwsh
        run: .\verify.cmd
      - name: Audit dependencies
        shell: pwsh
        run: .\audit.cmd
