name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        shell: pwsh
        run: .\setup.cmd
      - name: Cache approved FFmpeg build
        uses: actions/cache@v4
        with:
          path: vendor/ffmpeg/bin
          key: ffmpeg-089e4169e93b2b3f3acbfced3c0704d24276a225641bdda04d796d28b07a2a38
      - name: Fetch and verify approved FFmpeg build
        shell: pwsh
        run: .\scripts\fetch-ffmpeg.ps1 -Extract
      - name: Verify
        shell: pwsh
        run: .\verify.cmd
      - name: Audit dependencies
        shell: pwsh
        run: .\audit.cmd
