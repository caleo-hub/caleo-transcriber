name: Package candidate

on:
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/build-package.ps1"
      - "scripts/generate-sbom.py"
      - "scripts/inspect-package.py"
      - "scripts/install-inno-setup.ps1"
      - "scripts/smoke-package.ps1"
      - "src/**"
      - "pyproject.toml"
      - "THIRD_PARTY.md"
      - ".github/workflows/package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python toolchain
        shell: pwsh
        run: .\setup.cmd
      - name: Cache approved FFmpeg build
        uses: actions/cache@v4
        with:
          path: vendor/ffmpeg/bin
          key: ffmpeg-089e4169e93b2b3f3acbfced3c0704d24276a225641bdda04d796d28b07a2a38
      - name: Fetch and verify approved FFmpeg build
        shell: pwsh
        run: .\scripts\fetch-ffmpeg.ps1 -Extract
      - name: Install verified Inno Setup 6.7.3
        shell: pwsh
        run: .\scripts\install-inno-setup.ps1
      - name: Build and smoke candidate
        shell: pwsh
        run: .\build-package.cmd -Version 0.1.0
      - name: Upload unpublished candidate
        uses: actions/upload-artifact@v7
        with:
          name: CaleoTranscriber-0.1.0-unpublished
          path: |
            artifacts/candidate/0.1.0/
            build/package/CaleoTranscriber/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
